name: Build

# Runs the same "npm run build" Vercel runs (tsc -b && vite build) on every
# push and pull request, so a type error or build break shows up as a red X
# on the commit/PR in GitHub — before it ever reaches a Vercel deployment.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
